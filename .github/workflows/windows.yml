name: Windows preview

on:
  push:
    branches: [main]
    tags: ['windows-preview-*']
    paths:
      - 'Windows/**'
      - 'Sources/QuotaAI/Resources/ProviderIcons/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'Windows/**'
      - 'Sources/QuotaAI/Resources/ProviderIcons/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Codex integration
        run: dotnet run --project Windows/QuotaAI.Tests -c Release
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          # Tagged builds embed the tag's version (used by the in-app updater);
          # untagged CI builds stay 0.0.0 = development build.
          if [[ "$GITHUB_REF" == refs/tags/windows-preview-* ]]; then
            echo "value=${GITHUB_REF_NAME#windows-preview-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Windows x64
        run: >-
          dotnet publish Windows/QuotaAI.Tray -c Release -r win-x64
          -p:Version=${{ steps.version.outputs.value }}
          --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: QuotaAI-Windows-x64
          path: out/windows-x64/QuotaAI.exe
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-preview-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuotaAI-Windows-x64
      - name: Publish Windows preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "QuotaAI.exe#QuotaAI for Windows (x64)" --clobber
          else
            gh release create "$RELEASE_TAG" "QuotaAI.exe#QuotaAI for Windows (x64)" \
              --verify-tag --prerelease --latest=false \
              --title "QuotaAI Windows Preview (${RELEASE_TAG#windows-preview-})" \
              --notes "Standalone Windows x64 build. Download QuotaAI.exe to run the preview."
          fi
